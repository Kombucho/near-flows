[package]
name = "hylo-fork"
version = "0.1.0"
edition = "2021"
description = "Hylo transactions for the vault's templates, built with Hylo's own Rust SDK against a Solana fork (prints JSON)."
publish = false

# Not part of the contracts workspace: Hylo's SDK pulls Solana 2.3 and Anchor 0.32.
[workspace]

[dependencies]
# Hylo's official SDK (github.com/hylo-so/sdk, MPL-2.0), pinned to a release at least two weeks old.
hylo-quotes = "=2.7.2"
hylo-clients = "=2.7.2"
hylo-idl = "=2.7.2"
hylo-core = "=2.7.2"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
base64 = "0.22"
bincode = "1.3"
solana-rpc-client = "=2.3.13"
solana-rpc-client-api = "=2.3.13"
anchor-client = { version = "=0.32.1", features = ["async"] }
anchor-lang = "=0.32.1"
