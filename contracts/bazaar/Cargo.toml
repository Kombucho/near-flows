[package]
name = "bazaar"
version = "0.1.0"
edition = "2021"
description = "NEAR contract: list anything at your price, or auction it. Tokens, NFTs, or an idea."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"
math = { path = "../math" }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
