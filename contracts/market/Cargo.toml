[package]
name = "market"
version = "0.1.0"
edition = "2021"
description = "NEAR contract: a thin wrapper that stores one engine::Book and moves real tokens in and out."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"
engine = { path = "../engine", features = ["borsh"] }
math = { path = "../math", features = ["borsh"] }

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
