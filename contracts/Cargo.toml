[workspace]
resolver = "2"
members = ["math", "engine", "sim", "market", "mock_ft", "sandbox"]

# Contracts handle money: an overflow must abort the call, never wrap around silently.
[profile.release]
overflow-checks = true
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"

# The simulator must CATCH panics (to count them per seed), so it needs unwinding.
# Build it with: cargo run --profile sim -p sim
[profile.sim]
inherits = "release"
panic = "unwind"
