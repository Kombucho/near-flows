[workspace]
resolver = "2"
members = ["math", "engine", "flow", "sim", "market", "bazaar", "vault", "factory", "solguard", "evmtx", "intentsig", "mock_ft", "mock_nft", "mock_dex", "mock_signer", "mock_pyth", "priceboard", "sandbox"]

# Contracts handle money: an overflow must abort the call, never wrap around silently.
[profile.release]
overflow-checks = true
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"

# The simulator must CATCH panics (to count them per seed), so it needs unwinding.
# Build it with: cargo run --profile sim -p sim
[profile.sim]
inherits = "release"
panic = "unwind"
