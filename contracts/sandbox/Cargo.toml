[package]
name = "sandbox"
version = "0.1.0"
edition = "2021"
description = "Integration tests: the real wasm contracts in a local NEAR node (near-workspaces). Run `make build` first."
publish = false

[dependencies]

[dev-dependencies]
near-workspaces = "0.24.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
futures = "0.3"
solguard = { path = "../solguard", features = ["testkit"] }
ed25519-dalek = "2"
base64 = "0.22"
bs58 = "0.5"
hex = "0.4"
evmtx = { path = "../evmtx" }
k256 = { version = "0.13", features = ["ecdsa"] }
