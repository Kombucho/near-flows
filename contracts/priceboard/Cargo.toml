[package]
name = "priceboard"
version = "0.1.0"
edition = "2021"
description = "Price board: Pyth's read interface for prices Pyth doesn't carry (pump.fun memecoins), from k-of-n signed attestations (trusts the attesters) or Wormhole Queries of the bonding curve (trusts Wormhole's guardians)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# "unstable" only exposes env::ecrecover (a stable NEAR host function since 2022).
near-sdk = { version = "5.30.0", features = ["unstable"] }
math = { path = "../math" }
hex = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing", "unstable"] }
k256 = { version = "0.13", features = ["ecdsa"] }
serde_json = "1"
