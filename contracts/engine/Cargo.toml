[package]
name = "engine"
version = "0.1.0"
edition = "2021"
description = "The market engine as plain Rust: bins, liquidity positions, swaps, fees. near-sdk only behind the \"near\" feature, so it runs in tests and simulations."

[dependencies]
math = { path = "../math" }
borsh = { version = "1", features = ["derive"], optional = true }
near-sdk = { version = "5.30.0", optional = true }

[features]
# Lets the NEAR contract store the Book on chain. Off by default.
borsh = ["dep:borsh", "math/borsh"]
# Inside the NEAR contract: the Book's big collections live in lazy storage maps.
near = ["borsh", "dep:near-sdk"]
