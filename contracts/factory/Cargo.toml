[package]
name = "factory"
version = "0.1.0"
edition = "2021"
description = "NEAR contract: gives each user their own vault, sharing one copy of the vault code (global contract)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
